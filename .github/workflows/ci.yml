# CI: build and ctest on every push and pull request.
# - Ubuntu (gcc, clang) and macOS (Apple clang), each in Release and Debug.
# - Release also builds simulator_bench (CHRONOS_BENCH=ON); it is not run.
# - Debug runs under sanitizers, and any report fails the test. gcc: ASan+UBSan.
#   clang on Linux: UBSan only, as its static ASan runtime defines the operator
#   new that app/alloc_counter.cpp replaces. macOS: UBSan only, as ASan hangs at
#   startup on the developer's macOS 27 and is untried with that operator new.
# - The real-data tests skip: CHRONOS_ITCH_FILE is not set.
# - format: every C++ file must match .clang-format (clang-format 20.1.8).
# - isolation: the engine (include/, src/, app/) never includes server or web code, and
#   simulator_lib links only the standard library.
# - server-tsan: chronos_server_tests under ThreadSanitizer (Linux clang; TSan does not start on macOS 27).
# - web: the Trading Terminal (web/): typecheck, build and Vitest, then the Playwright end-to-end tests against a
#   Release chronos-serve on the fixture day chronos-e2e-fixture writes.
name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux-gcc-release,          os: ubuntu-latest, cxx: g++,     build_type: Release, sanitize: "OFF",     bench: "ON"}
          - {name: linux-gcc-debug-asan-ubsan, os: ubuntu-latest, cxx: g++,     build_type: Debug,   sanitize: "ON",      bench: "OFF"}
          - {name: linux-clang-release,        os: ubuntu-latest, cxx: clang++, build_type: Release, sanitize: "OFF",     bench: "ON"}
          - {name: linux-clang-debug-ubsan,    os: ubuntu-latest, cxx: clang++, build_type: Debug,   sanitize: undefined, bench: "OFF"}
          - {name: macos-release,              os: macos-latest,  cxx: clang++, build_type: Release, sanitize: "OFF",     bench: "ON"}
          - {name: macos-debug-ubsan,          os: macos-latest,  cxx: clang++, build_type: Debug,   sanitize: undefined, bench: "OFF"}
    steps:
      - uses: actions/checkout@v5
      - name: Let ASan map its shadow memory (needs 28-bit mmap randomisation)
        if: matrix.sanitize == 'ON'
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCHRONOS_SANITIZE=${{ matrix.sanitize }}
          -DCHRONOS_BENCH=${{ matrix.bench }}
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        run: ctest --test-dir build --output-on-failure --no-tests=error

  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: pipx install clang-format==20.1.8
      - name: clang-format
        run: bash scripts/check-format.sh

  isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Engine isolation
        run: bash scripts/check-isolation.sh

  server-tsan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Let TSan map its shadow memory (needs 28-bit mmap randomisation)
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCHRONOS_SANITIZE=thread
      - name: Build
        run: cmake --build build --parallel 4 --target chronos_server_tests
      - name: Test
        run: TSAN_OPTIONS=halt_on_error=1 ./build/chronos_server_tests --gtest_brief=1

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build chronos-serve and the fixture writer
        working-directory: .
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 4 --target chronos-serve chronos-e2e-fixture
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
